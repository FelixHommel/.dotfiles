# Prefix key
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# General
## Number windows and panes starting with 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

## Scrollback
set -g history-limit 100000
set -g display-time 2000

## Pass focus events to programs
set -s focus-events on

## Set terminal window title to session and window name
set -g set-titles on
set -g set-titles-string "##S / #W"

## Mark windows with new output in the stuts line
setw -g monitor-activity on

## No auto rename windows
set-option -g allow-rename off

## Reload config
bind r source-file ${HOME}/.tmux.conf \; display-message "${HOME}/.tmux.conf reloaded"

## Enable mous emode
set -g mouse on

# Copy mode and clipboard
## Use vim keybinds in copy mode
setw -g mode-keys vi

## Vim like selcetion
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

## Pipe every copy to wl-copy
set -s copy-command "wl-copy"

## Line numbers in copy mode
setw -g copy-mode-line-numbers relative

# Panes and windows
## Splitting panes
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind %
unbind '"'

## Easy pane switching (Alt+hjkl)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

## Windows
bind c new-window -c "#{pane_current_path}"

# Style 
## Status line position
set -g status-position top

## Redraw of status line
set -g status-interval 10

## Status line general
## Based on nvim-nightfox/duskfox: https://github.com/edeneast/nightfox.nvim/raw/main/extra/duskfox/duskfox.tmux
set -g status "on"
set -g status-style "fg=#cdcbe0,bg=#191726"
set -g status-justify "left"
set -g mode-style "fg=#191726,bg=#cdcbe0"
set -g message-style "fg=#191726,bg=#cdcbe0"
set -g message-command-style "fg=#191726,bg=#cdcbe0"
setw -g window-status-style "NONE,fg=#6e6a86,bg=#191726"
setw -g window-status-format "#[fg=#191726,bg=#191726,nobold,nounderscore,noitalics]#[default] #I | #W #F #[fg=#191726,bg=#191726,nobold,nounderscore,noitalics]"
setw -g window-status-current-format "#[fg=#191726,bg=#cdcbe0,nobold,nounderscore,noitalics]#[fg=#191726,bg=#cdcbe0,bold] #I | #W #F #[fg=#cdcbe0,bg=#191726,nobold,nounderscore,noitalics]"
setw -g window-status-activity-style "underscore,fg=#6e6a86,bg=#191726"
setw -g window-status-separator ""

## Status line left
set -g status-left "#[fg=#191726,bg=#569fba,bold] #S #[fg=#569fba,bg=#191726,nobold,nounderscore,noitalics] "
set -g status-left-style NONE
set -g status-left-length "100"

## Status line right
set -g status-right "#{prefix_highlight} #[fg=#191726,bg=#569fba,bold] #h "
set -g status-right-style NONE
set -g status-right-length "100"

## Pane borders
setw -g pane-border-lines heavy
setw -g pane-border-style "fg=#cdcbe0"
setw -g pane-active-border-style "fg=#569fba"

# Colors and Terminal
## 24-bit true color
set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-features ",xterm-kitty:RGB"

## Extended keys, so that programs can tell C-S and C-Enter apart
set -s extended-keys on
set -as terminal-features ",xterm*:extkeys"

## Allow passthrough escape sequences
setw -g allow-passthrough on

# Plugins
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-sensible"
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin "tmux-plugins/tmux-continuum"
set -g @plugin "tmux-plugins/tmux-yank"
set -g @plugin "tmux-plugins/tmux-prefix-highlight"

set -g @resurrect-strategy-nvim 'session'

set -g @continuum-restore "on"

set -g @prefix_highlight_fg '#191726'
set -g @prefix_highlight_bg '#569fba'

if "test ! -d ${HOME}/.config/tmux/plugins/tpm" \
        "run 'git clone https://github.com/tmux-plugins/tpm ${HOME}/.config/tmux/plugins/tpm && ${HOME}/.config/tmux/plugins/tpm/bin/install_plugins'"

# NOTE: This needs to be at the bottom
run "${HOME}/.config/tmux/plugins/tpm/tpm"
